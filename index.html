<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager with Step Progress</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>
        <div class="input-section">
            <input type="text" id="task-input" placeholder="Enter a new task...">
            <button id="add-task-btn">Add Task</button>
        </div>
        
        <div class="progress-section">
            <h2>Overall Progress</h2>
            <div class="progress-bar-container">
                <div class="progress-bar" id="overall-progress-bar"></div>
            </div>
            <p id="overall-progress-text">0% Average Completion</p>
        </div>

        <ul id="task-list">
            <!-- Tasks will be added here -->
        </ul>
    </div>

    <!-- Popup for a single completed task -->
    <div id="single-task-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Congratulations! 🎉</h2>
            <p>You've completed a task. Keep up the great work!</p>
        </div>
    </div>

    <!-- Popup for ALL completed tasks -->
    <div id="all-tasks-modal" class="modal">
        <div class="modal-content all-done">
            <span class="close-btn">&times;</span>
            <h2>All Tasks Completed! 🥳</h2>
            <p>Incredible work! You've finished everything for the day.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
